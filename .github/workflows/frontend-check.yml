name: Check TIKUS dashboard frontend

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "scripts/validate_frontend.py"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: node --check js/app.js
      - name: HTML / JS integration guard
        run: python scripts/validate_frontend.py
