name: Update TIKUS tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update showtimes
        run: python scripts/update_showtimes.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Collect Paragon seat data
        run: python scripts/paragon_seat_collector.py

      - name: Save tracker snapshot
        run: python scripts/save_snapshot.py

      - name: Commit changed tracker data
        run: |
          git config user.name "tikus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json data/history-index.json data/history data/paragon-seat-diagnostics.json
          git diff --cached --quiet || git commit -m "Refresh TIKUS performance tracker"
          git push
