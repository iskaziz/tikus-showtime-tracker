name: Update TIKUS tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh showtimes
        run: python scripts/update_showtimes.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run Paragon diagnostics
        run: python scripts/paragon_seat_collector.py

      - name: Run GSC booking diagnostics
        run: python scripts/gsc_booking_diagnostics.py

      - name: Read official GSC movie/showtime API
        run: python scripts/gsc_official_api.py

      - name: Correct TGV launch-day session IDs
        run: python scripts/correct_tgv_launch_day_ids.py

      - name: Restore full launch-day showtime history
        run: python scripts/launch_day_history_recovery.py

      - name: Recover previously observed GSC launch-day sessions
        run: python scripts/gsc_historical_recovery.py

      - name: Update live GSC showtimes from official API
        run: python scripts/gsc_live_collector.py

      - name: Update live GSC seat status
        run: python scripts/gsc_seat_collector.py

      - name: Preserve GSC session history
        run: python scripts/gsc_history_normalizer.py

      - name: Discover GSC seat endpoint names
        run: python scripts/gsc_seat_endpoint_discovery.py

      - name: Deep static analysis of GSC seat API names
        run: python scripts/gsc_seat_api_static_analysis.py

      - name: Run TGV booking diagnostics
        run: python scripts/tgv_booking_diagnostics.py

      - name: Collect live TGV seat status
        run: python scripts/tgv_live_collector.py

      - name: Upload TGV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgv-seat-diagnostics
          path: |
            data/tgv-seat-diagnostics.json
            data/tgv-live-collector.json
          if-no-files-found: warn

      - name: Upload GSC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-seat-diagnostics
          path: |
            data/gsc-seat-diagnostics.json
            data/gsc-official-api.json
            data/gsc-seat-endpoint-discovery.json
            data/gsc-seat-api-static-analysis.json
            data/gsc-live-collector.json
            data/gsc-live-seats.json
          if-no-files-found: warn

      - name: Merge seat observations
        run: python scripts/merge_seat_observations.py

      - name: Save snapshot
        run: python scripts/save_snapshot.py

      - name: Re-apply launch-day history after live collectors
        run: python scripts/launch_day_history_recovery.py

      - name: Commit changed tracker data
        run: |
          git config user.name "tikus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json
          git add data/seed-current.json
          git add data/history-index.json
          git add data/history
          git add data/paragon-seat-diagnostics.json
          git add data/gsc-seat-diagnostics.json
          git add data/gsc-official-api.json
          git add data/gsc-seat-endpoint-discovery.json
          git add data/gsc-seat-api-static-analysis.json
          git add data/gsc-live-collector.json
          git add data/gsc-live-seats.json
          git add data/tgv-seat-diagnostics.json
          git add data/tgv-live-collector.json
          git diff --cached --quiet || git commit -m "Refresh TIKUS performance tracker"
          git push
