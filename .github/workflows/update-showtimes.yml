name: Update TIKUS tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update showtimes
        run: python scripts/update_showtimes.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Check Paragon
        run: python scripts/paragon_seat_collector.py

      - name: Run GSC diagnostics
        run: python scripts/gsc_booking_diagnostics.py

      - name: Run TGV diagnostics
        run: python scripts/tgv_booking_diagnostics.py

      - name: Upload TGV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgv-seat-diagnostics
          path: data/tgv-seat-diagnostics.json
          if-no-files-found: warn

      - name: Upload GSC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-seat-diagnostics
          path: data/gsc-seat-diagnostics.json
          if-no-files-found: warn

      - name: Merge verified seat observations
        run: python scripts/merge_seat_observations.py

      - name: Save snapshot
        run: python scripts/save_snapshot.py

      - name: Commit changed tracker data
        run: |
          git config user.name "tikus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/current.json data/history-index.json data/history
          git add data/paragon-seat-diagnostics.json || true
          git add data/gsc-seat-diagnostics.json || true
          git add data/tgv-seat-diagnostics.json || true
          git diff --cached --quiet || git commit -m "Refresh TIKUS performance tracker"
          git push
